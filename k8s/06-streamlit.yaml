apiVersion: v1
kind: Service
metadata:
  name: streamlit
  namespace: wiki-search
spec:
  selector:
    app: streamlit
  ports:
    - name: http
      port: 8501
      targetPort: 8501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: wiki-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
        - name: streamlit
          image: REPLACE_WITH_ACR.azurecr.io/wiki-search-engine:latest
          command:
            - streamlit
            - run
            - /opt/spark/work-dir/app.py
            - --server.address=0.0.0.0
            - --server.port=8501
          env:
            - name: ES_URL
              value: http://elasticsearch:9200
            - name: ES_INDEX
              value: wikipedia_index
          ports:
            - containerPort: 8501
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
