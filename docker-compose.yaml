services:
  # 1. Elasticsearch (The Storage & Search Engine)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false  
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"  
    ports:
      - "9200:9200"
    networks:
      - search-network

  # 2. Kibana (The User Interface)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - search-network

  # 3. Apache Spark Master (The Brain)
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    # The official image uses commands to start the master instead of environment variables
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/spark/work-dir/data  
      - ./scripts:/opt/spark/work-dir/scripts
    networks:
      - search-network

  # 4. Apache Spark Worker (The Muscle)
  spark-worker:
    image: apache/spark:3.5.1
    # Command to start the worker and connect it to the master node
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      replicas: 3 # 3-node distributed cluster
    environment:
      - SPARK_WORKER_CORES=4    # Forces each worker to only use 3 cores (9 total)
      - SPARK_WORKER_MEMORY=4g  # Forces each worker to only use 2GB RAM (6GB total)
    volumes:
      - ./data:/opt/spark/work-dir/data
      - ./scripts:/opt/spark/work-dir/scripts
    depends_on:
      - spark-master
    networks:
      - search-network

networks:
  search-network:
    driver: bridge