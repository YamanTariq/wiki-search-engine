services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - "9200:9200"
    networks:
      search-network:
        aliases:
          - elasticsearch
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"[^r]'"]
      interval: 5s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - search-network

  spark-master:
    build: .
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/spark/work-dir/data
      - ./scripts:/opt/spark/work-dir/scripts
      - spark-ivy-cache:/tmp/.ivy
    depends_on:
      - elasticsearch
    networks:
      - search-network

  spark-worker:
    build: .
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      replicas: 3
    environment:
      - SPARK_WORKER_CORES=3
      - SPARK_WORKER_MEMORY=3g
    volumes:
      - ./data:/opt/spark/work-dir/data
      - ./scripts:/opt/spark/work-dir/scripts
      - spark-ivy-cache:/tmp/.ivy
    depends_on:
      elasticsearch:
        condition: service_healthy
      spark-master:
        condition: service_started
    networks:
      search-network:
        aliases:
          - spark-worker-node

networks:
  search-network:
    driver: bridge

volumes:
  spark-ivy-cache:
  es-data: